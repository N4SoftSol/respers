<div class="space-y-6 max-w-4xl">
  <div>
    <h1 class="text-2xl font-bold text-slate-900 dark:text-slate-100">Faqs</h1>
    <p class="text-slate-500 dark:text-slate-400 text-sm">
      Frequently asked questions about the portal
    </p>
  </div>

  <div
    class="bg-white dark:bg-slate-800/80 rounded-xl p-6 border border-slate-200 dark:border-slate-700/60 shadow-sm space-y-4"
  >
    <h2 class="text-base font-bold text-slate-800 dark:text-slate-200">Faq's 1</h2>

    <div class="space-y-3">
      @for (faq of faqList; track faq.id) {
        <div
          class="bg-slate-50 dark:bg-slate-900/60 border border-slate-200 dark:border-slate-700/80 rounded-xl overflow-hidden transition-all"
        >
          <button
            (click)="toggleFaq(faq.id)"
            class="w-full text-left p-4 flex justify-between items-center font-bold text-slate-800 dark:text-slate-100 hover:text-blue-600 dark:hover:text-blue-400 cursor-pointer transition-colors"
          >
            <span>{{ faq.question }}</span>
            <span
              class="text-lg transition-transform duration-200"
              [class.rotate-180]="openFaqId() === faq.id"
            >
              ▾
            </span>
          </button>

          @if (openFaqId() === faq.id) {
            <div
              class="px-4 pb-4 text-xs text-slate-600 dark:text-slate-400 leading-relaxed border-t border-slate-200/50 dark:border-slate-800 pt-3"
            >
              {{ faq.answer }}
            </div>
          }
        </div>
      }
    </div>
  </div>
</div>
