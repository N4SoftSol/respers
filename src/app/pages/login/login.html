<div class="min-h-screen bg-slate-100 flex items-center justify-center p-4">
  <div class="max-w-md w-full bg-white p-8 rounded-xl shadow-md border border-slate-200">
    <h2 class="text-2xl font-bold text-slate-900 text-center mb-6">Sign In</h2>

    @if (errorMessage()) {
      <div class="bg-red-50 text-red-700 p-3 rounded-lg mb-4 text-sm font-medium">
        {{ errorMessage() }}
      </div>
    }

    <form (submit)="onLogin(); $event.preventDefault()" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input
          type="text"
          [ngModel]="username()"
          (ngModelChange)="username.set($event)"
          name="username"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input
          type="password"
          [ngModel]="password()"
          (ngModelChange)="password.set($event)"
          name="password"
          required
          class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <button
        type="submit"
        [disabled]="isLoading()"
        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-medium py-2 rounded-lg transition-colors disabled:bg-blue-300"
      >
        @if (isLoading()) {
          Logging in...
        } @else {
          Sign In
        }
      </button>
    </form>
  </div>
</div>
