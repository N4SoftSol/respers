name: ResPers Build

on:
  push:
    branches:
      - main

  workflow_dispatch:

jobs:
  build-and-push:
    runs-on:
      - self-hosted
      - shared

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4
        with:
          clean: true

      - name: Install Dependencies
        run: |
          npm ci

      - name: Build Angular
        run: |
          npm run build -- --configuration production

      - name: Prepare Docker Assets
        run: |
          rm -rf app
          mkdir app
          cp -r dist/angular-auth-dashboard/browser/* app/

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build Docker Image
        run: |
          docker build \
            -t naveenezone/respers:latest \
            -t naveenezone/respers:${{ github.sha }} .

      - name: Push Docker Image
        run: |
          docker push naveenezone/respers:latest
          docker push naveenezone/respers:${{ github.sha }}

      - name: Deploy
        run: |
          cd /app/build/n4ss-respers
          docker compose pull
          docker compose up -d
